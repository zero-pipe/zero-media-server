[general]
log_file=zms_media_server.log
log_level=info
log_max_mb=0
log_keep_count=5
poller_threads=8
stream_none_reader_delay_ms=20000
media_server_id=1
listen_host=0.0.0.0
externIP=127.0.0.1
buf_pool_enable=1
buf_pool_mode=hybrid
buf_pool_max=128
# Live GOP cache: retain this many GOPs under pressure (default 3; clamp 1–32)
gop_target_gops=3
# Time window in seconds (0=off). Drops oldest GOP when span exceeds this (keep ≥1).
gop_cache_sec=0
vod_work_threads=2

[hook]
enable=1
timeout_sec=10
retry=1
retry_delay=3
on_publish=http://127.0.0.1:18080/index/hook/on_publish
on_stream_changed=http://127.0.0.1:18080/index/hook/on_stream_changed
on_stream_none_reader=http://127.0.0.1:18080/index/hook/on_stream_none_reader
on_play=http://127.0.0.1:18080/index/hook/on_play
on_play_stop=http://127.0.0.1:18080/index/hook/on_play_stop
on_server_started=http://127.0.0.1:18080/index/hook/on_server_started
on_record_mp4=http://127.0.0.1:18080/index/hook/on_record_mp4
stream_changed_schemas=rtsp/rtmp/srt/rtp-ps/webrtc

[rtmp]
port=1935

[rtsp]
port=8554
auth_user=
auth_pass=
test_reject_tcp_setup=0

[http]
port=8080

[srt]
port=9000

[webrtc]
enable=1
port_min=50000
port_max=60000

[api]
secret=

[protocol]
enable_rtmp=1
enable_rtsp=1
enable_srt=1
enable_hls=1
enable_audio=1
modify_stamp=0

[format]
flv_egress_adapter=zms

[record]
app=vod
root=./www/record
file_repeat=0
mp4_max_second=180

[hls]
seg_dur=2
seg_num=3

[play]
ring_max_lag=240
catchup_lag=16
frame_budget_live=8
frame_budget_catchup=96
burst_budget=96
flv_budget_live=48
flv_budget_vod=8
pace_lead_ms=350
resync_lag=16
resync_lag_max=960
resync_cooldown_ms=3000
slow_consumer_kick_lag=960
vod_catchup_start=96
vod_catchup_seek=32
vod_prefill_lag=32

[proxy]
proxy_pull=
proxy_app=live
proxy_stream=
proxy_prefix=
retry_count=-1
reconnect_delay_ms=2000

[ssl]
ca_file=
verify_peer=1
client_cert=
client_key=
